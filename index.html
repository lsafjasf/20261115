<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨夜环境声 · 三频段动态门限分离</title>
<style>
  :root {
    --bg: #0d1420; --panel: #16202f; --line: #26344a;
    --txt: #d7e2f0; --dim: #7f93ad;
    --low: #7c6cf0; --mid: #2fae8f; --high: #e0a23c; --err: #e05c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--txt);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 860px; max-width: 100%; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  .transport { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  button {
    background: #1f2d42; color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #273950; }
  button.active { background: #2f5d8a; border-color: #4a86c5; }
  button.solo-on { background: #8a5d2f; border-color: #c58a4a; }
  .tracks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .track { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .track h2 { font-size: 15px; margin: 0 0 2px; }
  .track .band { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .meter { height: 14px; background: #0a101b; border-radius: 7px; overflow: hidden; margin-bottom: 6px; }
  .meter > div { height: 100%; width: 0%; transition: width 60ms linear; }
  .track.low .meter > div { background: var(--low); }
  .track.mid .meter > div { background: var(--mid); }
  .track.high .meter > div { background: var(--high); }
  .db { font-size: 11px; color: var(--dim); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .gate { font-size: 12px; margin-bottom: 10px; }
  .gate .state { color: var(--dim); }
  .gate .state.open { color: #6fe0a0; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 8px 0 2px; }
  input[type=range] { width: 100%; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 14px; }
  .panel h2 { font-size: 14px; margin: 0 0 8px; }
  .xover { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  .err-wrap { display: flex; align-items: center; gap: 12px; }
  .err-wrap .meter { flex: 1; margin: 0; }
  .err-wrap .meter > div { background: var(--err); }
  #errVal { font-size: 13px; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  #status { margin-top: 14px; font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>雨夜环境声 · 实时分离</h1>
  <div class="sub">全部声音由 Web Audio 合成（无音频文件）· 三频段分频 + 自适应动态门限</div>

  <div class="transport">
    <button id="btnPlay">▶ 开始</button>
    <button id="btnPause" disabled>暂停</button>
    <button id="btnMix" disabled>恢复原混音</button>
    <button id="btnReset" disabled>重置参数</button>
  </div>

  <div class="tracks">
    <div class="track low" id="track-low">
      <h2>远处雷声</h2>
      <div class="band">低通道 &lt; <span class="fc">250</span> Hz</div>
      <div class="meter"><div id="meter-low"></div></div>
      <div class="db" id="db-low">-∞ dB</div>
      <div class="gate">门限状态：<span class="state" id="gate-low">—</span></div>
      <button class="solo" data-track="low" disabled>单轨试听</button>
      <label>门限灵敏度 <span id="thrVal-low">1.0</span></label>
      <input type="range" id="thr-low" min="0.2" max="4" step="0.1" value="1.0" disabled>
    </div>
    <div class="track mid" id="track-mid">
      <h2>地面水声</h2>
      <div class="band"><span class="fc">250</span> – <span class="fc2">2000</span> Hz</div>
      <div class="meter"><div id="meter-mid"></div></div>
      <div class="db" id="db-mid">-∞ dB</div>
      <div class="gate">门限状态：<span class="state" id="gate-mid">—</span></div>
      <button class="solo" data-track="mid" disabled>单轨试听</button>
      <label>门限灵敏度 <span id="thrVal-mid">1.0</span></label>
      <input type="range" id="thr-mid" min="0.2" max="4" step="0.1" value="1.0" disabled>
    </div>
    <div class="track high" id="track-high">
      <h2>雨棚敲击</h2>
      <div class="band">高通道 &gt; <span class="fc2">2000</span> Hz</div>
      <div class="meter"><div id="meter-high"></div></div>
      <div class="db" id="db-high">-∞ dB</div>
      <div class="gate">门限状态：<span class="state" id="gate-high">—</span></div>
      <button class="solo" data-track="high" disabled>单轨试听</button>
      <label>门限灵敏度 <span id="thrVal-high">1.0</span></label>
      <input type="range" id="thr-high" min="0.2" max="4" step="0.1" value="1.0" disabled>
    </div>
  </div>

  <div class="panel">
    <h2>分频点</h2>
    <div class="xover">
      <div>
        <label>低/中分频 <span id="xLowVal">250</span> Hz</label>
        <input type="range" id="xLow" min="80" max="800" step="10" value="250" disabled>
      </div>
      <div>
        <label>中/高分频 <span id="xHighVal">2000</span> Hz</label>
        <input type="range" id="xHigh" min="800" max="8000" step="50" value="2000" disabled>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>剩余混合误差（混音 − 三轨之和）</h2>
    <div class="err-wrap">
      <div class="meter"><div id="meter-err"></div></div>
      <span id="errVal">—</span>
    </div>
  </div>

  <div id="status">就绪：点击「开始」生成雨夜环境声。</div>
</main>
<script>
"use strict";
// ---------- 默认值（重置参数用） ----------
const DEFAULTS = { xLow: 250, xHigh: 2000, thrLow: 1.0, thrMid: 1.0, thrHigh: 1.0 };

// ---------- 全局状态 ----------
let ctx = null;
let started = false;
let mixMode = false;            // true = 播放原混音，false = 播放分离三轨
const solo = { low: false, mid: false, high: false };
const nodes = {};               // 音频图节点
const gates = {                 // 动态门限运行时状态
  low:  { floor: 1e-4, gain: 0, open: false },
  mid:  { floor: 1e-4, gain: 0, open: false },
  high: { floor: 1e-4, gain: 0, open: false },
};

// ---------- 噪声缓冲（程序生成，无音频文件） ----------
function makeNoiseBuffer(ctx, seconds, color) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    if (color === "pink") {
      b0 = 0.99765 * b0 + w * 0.0990460;
      b1 = 0.96300 * b1 + w * 0.2965164;
      b2 = 0.57000 * b2 + w * 1.0526913;
      d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.25;
    } else { // brown
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.5;
    }
  }
  return buf;
}

// ---------- 三源合成 ----------
function buildSynths(ctx, mixBus) {
  // 1) 远处雷声：棕噪声 -> 低通 -> 包络增益（调度器触发隆隆声）
  const thunderSrc = ctx.createBufferSource();
  thunderSrc.buffer = makeNoiseBuffer(ctx, 4, "brown");
  thunderSrc.loop = true;
  const thunderLp = ctx.createBiquadFilter();
  thunderLp.type = "lowpass"; thunderLp.frequency.value = 110; thunderLp.Q.value = 0.6;
  const thunderGain = ctx.createGain(); thunderGain.gain.value = 0.0;
  const thunderBed = ctx.createGain(); thunderBed.gain.value = 0.05; // 持续低鸣
  thunderSrc.connect(thunderLp);
  thunderLp.connect(thunderBed).connect(mixBus);
  thunderLp.connect(thunderGain).connect(mixBus);
  thunderSrc.start();

  function scheduleThunder() {
    if (!ctx) return;
    const t = ctx.currentTime + 0.1;
    const peak = 0.5 + Math.random() * 0.5;
    const dur = 2.5 + Math.random() * 3.5;
    const g = thunderGain.gain;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(peak, t + 0.4 + Math.random() * 0.6);
    g.setTargetAtTime(0, t + 1.2, dur / 3);           // 缓慢衰减
    // 雷声中偶发二次回滚
    if (Math.random() < 0.5) {
      g.setTargetAtTime(peak * 0.4, t + dur * 0.6, 0.3);
      g.setTargetAtTime(0, t + dur * 0.8, 0.6);
    }
    nodes.thunderTimer = setTimeout(scheduleThunder, (5 + Math.random() * 8) * 1000);
  }
  scheduleThunder();

  // 2) 地面水声：粉噪声 -> 带通 -> 缓慢起伏增益
  const waterSrc = ctx.createBufferSource();
  waterSrc.buffer = makeNoiseBuffer(ctx, 3, "pink");
  waterSrc.loop = true;
  const waterBp = ctx.createBiquadFilter();
  waterBp.type = "bandpass"; waterBp.frequency.value = 700; waterBp.Q.value = 0.8;
  const waterGain = ctx.createGain(); waterGain.gain.value = 0.30;
  const waterLfo = ctx.createOscillator(); waterLfo.frequency.value = 0.13;
  const waterLfoGain = ctx.createGain(); waterLfoGain.gain.value = 0.08;
  waterLfo.connect(waterLfoGain).connect(waterGain.gain);
  waterSrc.connect(waterBp).connect(waterGain).connect(mixBus);
  waterSrc.start(); waterLfo.start();

  // 3) 雨棚敲击：衰减正弦“叮”声（2.5k–5.5kHz）+ 高通噪声点击
  const dripNoise = makeNoiseBuffer(ctx, 0.1, "pink");
  function scheduleDrip() {
    if (!ctx) return;
    const t = ctx.currentTime + 0.02;
    const freq = 2500 + Math.random() * 3000;
    const amp = 0.25 + Math.random() * 0.45;
    const decay = 0.05 + Math.random() * 0.12;
    // 主体：正弦衰减，频谱纯净
    const osc = ctx.createOscillator();
    osc.type = "sine"; osc.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(amp, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.001, t + decay);
    osc.connect(g).connect(mixBus);
    osc.start(t); osc.stop(t + decay + 0.05);
    // 点击感：极短高通噪声
    const click = ctx.createBufferSource(); click.buffer = dripNoise;
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 2200;
    const cg = ctx.createGain();
    cg.gain.setValueAtTime(amp * 0.5, t);
    cg.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
    click.connect(hp).connect(cg).connect(mixBus);
    click.start(t); click.stop(t + 0.05);
    osc.onended = () => { osc.disconnect(); g.disconnect(); click.disconnect(); hp.disconnect(); cg.disconnect(); };
    nodes.dripTimer = setTimeout(scheduleDrip, 60 + Math.random() * 260);
  }
  scheduleDrip();
}

// ---------- 分离链路：三频段分频 + 动态门限 ----------
function buildSeparation(ctx, mixBus, master) {
  const mk = () => {
    const g = ctx.createGain();
    const an = ctx.createAnalyser(); an.fftSize = 2048;
    return { g, an, buf: new Float32Array(an.fftSize) };
  };

  // 低通道（雷声）
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = DEFAULTS.xLow; lp.Q.value = 0.7;
  // 中通道（水声）= 高通 + 低通串联
  const bpH = ctx.createBiquadFilter(); bpH.type = "highpass"; bpH.frequency.value = DEFAULTS.xLow; bpH.Q.value = 0.7;
  const bpL = ctx.createBiquadFilter(); bpL.type = "lowpass"; bpL.frequency.value = DEFAULTS.xHigh; bpL.Q.value = 0.7;
  // 高通道（雨棚）
  const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = DEFAULTS.xHigh; hp.Q.value = 0.7;

  const gateLow = mk(), gateMid = mk(), gateHigh = mk();
  const preLow = mk(), preMid = mk(), preHigh = mk(); // 门限检测用（门前能量）

  mixBus.connect(lp);   lp.connect(preLow.an);   lp.connect(gateLow.g);
  mixBus.connect(bpH);  bpH.connect(bpL);  bpL.connect(preMid.an);  bpL.connect(gateMid.g);
  mixBus.connect(hp);   hp.connect(preHigh.an);  hp.connect(gateHigh.g);

  // 每轨输出 -> 独奏增益 -> 主输出
  const soloLow = ctx.createGain(), soloMid = ctx.createGain(), soloHigh = ctx.createGain();
  const outLow = mk(), outMid = mk(), outHigh = mk();
  gateLow.g.connect(outLow.an);  gateLow.g.connect(soloLow).connect(master);
  gateMid.g.connect(outMid.an);  gateMid.g.connect(soloMid).connect(master);
  gateHigh.g.connect(outHigh.an); gateHigh.g.connect(soloHigh).connect(master);

  // 原混音直通透传
  const mixGain = ctx.createGain(); mixGain.gain.value = 0;
  const mixAn = mk();
  mixBus.connect(mixAn.an);
  mixBus.connect(mixGain).connect(master);

  // 残余误差 = 混音 − (低+中+高)
  const residual = ctx.createGain();
  const inv = ctx.createGain(); inv.gain.value = -1;
  const sumNode = ctx.createGain();
  gateLow.g.connect(sumNode); gateMid.g.connect(sumNode); gateHigh.g.connect(sumNode);
  mixBus.connect(residual);
  sumNode.connect(inv).connect(residual);
  const errAn = mk();
  residual.connect(errAn.an);

  Object.assign(nodes, {
    lp, bpH, bpL, hp,
    gateLow, gateMid, gateHigh, preLow, preMid, preHigh,
    soloLow, soloMid, soloHigh, outLow, outMid, outHigh,
    mixGain, mixAn, errAn, master,
  });
  applyRouting();
}

// 独奏 / 原混音路由
function applyRouting() {
  if (!nodes.master) return;
  const t = ctx.currentTime;
  const anySolo = solo.low || solo.mid || solo.high;
  const set = (param, v) => param.setTargetAtTime(v, t, 0.03);
  if (mixMode) {
    set(nodes.mixGain.gain, 1);
    set(nodes.soloLow.gain, 0); set(nodes.soloMid.gain, 0); set(nodes.soloHigh.gain, 0);
  } else {
    set(nodes.mixGain.gain, 0);
    set(nodes.soloLow.gain,  anySolo ? (solo.low  ? 1 : 0) : 1);
    set(nodes.soloMid.gain,  anySolo ? (solo.mid  ? 1 : 0) : 1);
    set(nodes.soloHigh.gain, anySolo ? (solo.high ? 1 : 0) : 1);
  }
}

// ---------- 计量 + 动态门限循环 ----------
function rms(an, buf) {
  an.getFloatTimeDomainData(buf);
  let s = 0;
  for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
  return Math.sqrt(s / buf.length);
}

function meterLoop() {
  if (!ctx) return;
  const pre = { low: nodes.preLow, mid: nodes.preMid, high: nodes.preHigh };
  const gateN = { low: nodes.gateLow, mid: nodes.gateMid, high: nodes.gateHigh };
  const thr = {
    low: parseFloat(document.getElementById("thr-low").value),
    mid: parseFloat(document.getElementById("thr-mid").value),
    high: parseFloat(document.getElementById("thr-high").value),
  };
  const t = ctx.currentTime;
  for (const k of ["low", "mid", "high"]) {
    const e = rms(pre[k].an, pre[k].buf);
    const g = gates[k];
    // 自适应噪声底：缓慢跟踪近期最小能量
    g.floor = Math.min(g.floor * 1.005, Math.max(e, 1e-5));
    if (e < g.floor * 1.5) g.floor = g.floor * 0.9 + e * 0.1;
    const threshold = g.floor * (2.5 * thr[k]); // 动态门限 = 噪声底 × 灵敏度
    g.open = e > threshold;
    const target = g.open ? 1 : 0.06;
    g.gain = target;
    gateN[k].g.gain.setTargetAtTime(target, t, g.open ? 0.01 : 0.08);
  }
  updateMeters();
  requestAnimationFrame(meterLoop);
}

// ---------- UI 计量刷新 ----------
function fmtDb(e) {
  return e < 1e-5 ? "-∞ dB" : (20 * Math.log10(e)).toFixed(1) + " dB";
}
function updateMeters() {
  const out = { low: nodes.outLow, mid: nodes.outMid, high: nodes.outHigh };
  for (const k of ["low", "mid", "high"]) {
    const e = rms(out[k].an, out[k].buf);
    document.getElementById("meter-" + k).style.width = Math.min(100, e * 220) + "%";
    document.getElementById("db-" + k).textContent = fmtDb(e);
    const st = document.getElementById("gate-" + k);
    st.textContent = gates[k].open ? "打开" : "关闭";
    st.classList.toggle("open", gates[k].open);
  }
  const mixE = rms(nodes.mixAn.an, nodes.mixAn.buf);
  const errE = rms(nodes.errAn.an, nodes.errAn.buf);
  const pct = mixE < 1e-5 ? 0 : (errE / mixE) * 100;
  document.getElementById("meter-err").style.width = Math.min(100, pct * 2) + "%";
  document.getElementById("errVal").textContent = pct.toFixed(1) + "%";
}

// ---------- 控件 ----------
const $ = (id) => document.getElementById(id);

function setControlsEnabled(on) {
  ["btnPause", "btnMix", "btnReset", "xLow", "xHigh", "thr-low", "thr-mid", "thr-high"]
    .forEach((id) => ($(id).disabled = !on));
  document.querySelectorAll(".solo").forEach((b) => (b.disabled = !on));
}

function start() {
  if (started) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain(); master.gain.value = 0.9;
  master.connect(ctx.destination);
  const mixBus = ctx.createGain(); mixBus.gain.value = 1;
  nodes.mixBus = mixBus;
  buildSynths(ctx, mixBus);
  buildSeparation(ctx, mixBus, master);
  started = true;
  setControlsEnabled(true);
  $("btnPlay").textContent = "● 运行中";
  $("btnPlay").disabled = true;
  $("status").textContent = "运行中：分离输出（可单轨试听或恢复原混音）。";
  meterLoop();
}

async function togglePause() {
  if (!ctx) return;
  if (ctx.state === "running") {
    await ctx.suspend();
    $("btnPause").textContent = "继续";
    $("status").textContent = "已暂停。";
  } else if (ctx.state === "suspended") {
    await ctx.resume();
    $("btnPause").textContent = "暂停";
    $("status").textContent = "运行中。";
  }
}

function toggleMix() {
  mixMode = !mixMode;
  $("btnMix").classList.toggle("active", mixMode);
  $("btnMix").textContent = mixMode ? "返回分离输出" : "恢复原混音";
  $("status").textContent = mixMode ? "播放原混音（未分离）。" : "运行中：分离输出。";
  applyRouting();
}

function toggleSolo(track) {
  solo[track] = !solo[track];
  document.querySelector(`.solo[data-track="${track}"]`).classList.toggle("solo-on", solo[track]);
  applyRouting();
}

function applyCrossover() {
  const lo = parseFloat($("xLow").value), hi = parseFloat($("xHigh").value);
  if (nodes.lp) {
    nodes.lp.frequency.value = lo;
    nodes.bpH.frequency.value = lo;
    nodes.bpL.frequency.value = hi;
    nodes.hp.frequency.value = hi;
  }
  $("xLowVal").textContent = lo;
  $("xHighVal").textContent = hi;
  document.querySelectorAll("#track-low .fc").forEach((e) => (e.textContent = lo));
  document.querySelectorAll("#track-mid .fc").forEach((e) => (e.textContent = lo));
  document.querySelectorAll("#track-mid .fc2").forEach((e) => (e.textContent = hi));
  document.querySelectorAll("#track-high .fc2").forEach((e) => (e.textContent = hi));
}

function resetParams() {
  $("xLow").value = DEFAULTS.xLow;
  $("xHigh").value = DEFAULTS.xHigh;
  $("thr-low").value = DEFAULTS.thrLow;
  $("thr-mid").value = DEFAULTS.thrMid;
  $("thr-high").value = DEFAULTS.thrHigh;
  ["low", "mid", "high"].forEach((k) => {
    $("thrVal-" + k).textContent = DEFAULTS["thr" + k[0].toUpperCase() + k.slice(1)].toFixed(1);
    solo[k] = false;
    document.querySelector(`.solo[data-track="${k}"]`).classList.remove("solo-on");
    gates[k].floor = 1e-4;
  });
  if (mixMode) toggleMix();
  applyCrossover();
  applyRouting();
  $("status").textContent = "参数已重置为默认值。";
}

$("btnPlay").addEventListener("click", start);
$("btnPause").addEventListener("click", togglePause);
$("btnMix").addEventListener("click", toggleMix);
$("btnReset").addEventListener("click", resetParams);
document.querySelectorAll(".solo").forEach((b) =>
  b.addEventListener("click", () => toggleSolo(b.dataset.track)));
$("xLow").addEventListener("input", applyCrossover);
$("xHigh").addEventListener("input", applyCrossover);
["low", "mid", "high"].forEach((k) =>
  $("thr-" + k).addEventListener("input", (e) => ($("thrVal-" + k).textContent = parseFloat(e.target.value).toFixed(1))));

// ---------- 自动化测试钩子 ----------
window.__test = {
  get state() {
    return {
      started,
      ctxState: ctx ? ctx.state : "none",
      mixMode,
      solo: { ...solo },
      gates: {
        low: { ...gates.low }, mid: { ...gates.mid }, high: { ...gates.high },
      },
      gains: nodes.master ? {
        mix: nodes.mixGain.gain.value,
        low: nodes.soloLow.gain.value,
        mid: nodes.soloMid.gain.value,
        high: nodes.soloHigh.gain.value,
      } : null,
      energy: nodes.master ? {
        low: rms(nodes.outLow.an, nodes.outLow.buf),
        mid: rms(nodes.outMid.an, nodes.outMid.buf),
        high: rms(nodes.outHigh.an, nodes.outHigh.buf),
        mix: rms(nodes.mixAn.an, nodes.mixAn.buf),
        err: rms(nodes.errAn.an, nodes.errAn.buf),
      } : null,
      sliders: {
        xLow: $("xLow").value, xHigh: $("xHigh").value,
        thrLow: $("thr-low").value, thrMid: $("thr-mid").value, thrHigh: $("thr-high").value,
      },
    };
  },
};
</script>
</body>
</html>
