<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可编辑草地与树林 · Canvas 2D</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #1f2a22;
      color: #e8efe6;
    }
    header {
      padding: 14px 22px;
      background: #26352b;
      border-bottom: 1px solid #3a4f3f;
    }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 4px 0 0; font-size: 12px; color: #9db5a3; }
    main {
      display: flex;
      gap: 18px;
      padding: 18px 22px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .stage {
      position: relative;
      line-height: 0;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    canvas {
      display: block;
      width: 960px;
      max-width: 92vw;
      height: auto;
      background: #6fae43;
      cursor: crosshair;
    }
    .hint {
      position: absolute;
      left: 10px;
      bottom: 8px;
      font-size: 11px;
      line-height: 1.5;
      color: #f2f7ef;
      background: rgba(20, 30, 22, 0.62);
      padding: 5px 9px;
      border-radius: 6px;
      pointer-events: none;
    }
    aside {
      width: 270px;
      background: #26352b;
      border: 1px solid #3a4f3f;
      border-radius: 10px;
      padding: 16px;
    }
    .field { margin-bottom: 15px; }
    .field label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      color: #c4d6c5;
    }
    .field label b { color: #ffd98a; font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: #8cc665; }
    select, input[type="number"] {
      width: 100%;
      padding: 7px 9px;
      border-radius: 7px;
      border: 1px solid #4a6350;
      background: #1f2d23;
      color: #e8efe6;
      font-size: 13px;
    }
    .season-row { display: flex; gap: 6px; }
    .season-row button {
      flex: 1;
      padding: 8px 0;
      border-radius: 7px;
      border: 1px solid #4a6350;
      background: #1f2d23;
      color: #cfe0cf;
      cursor: pointer;
      font-size: 13px;
    }
    .season-row button.active {
      background: #6fa04a;
      border-color: #9ccb74;
      color: #102016;
      font-weight: 700;
    }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-grid button, .btn-grid label {
      padding: 9px 6px;
      border-radius: 7px;
      border: 1px solid #4a6350;
      background: #314636;
      color: #e8efe6;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }
    .btn-grid button:hover, .btn-grid label:hover, .season-row button:hover {
      border-color: #9ccb74;
    }
    .stats {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed #4a6350;
      font-size: 12px;
      line-height: 1.8;
      color: #9db5a3;
    }
    .stats b { color: #ffd98a; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      background: rgba(15, 24, 17, 0.92);
      border: 1px solid #6fa04a;
      color: #e8efe6;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 10;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>可编辑草地与树林</h1>
    <p>Canvas 2D 分层渲染：地形底色 · 水面 · 道路 · 阴影 · 风动草叶与树冠。切换季节只换材质与叶量，植物位置保持不变。</p>
  </header>
  <main>
    <div class="stage">
      <canvas id="scene" width="960" height="600"></canvas>
      <div class="hint">
        拖动道路节点改线 · 双击线段插入节点 · 双击节点删除（至少保留 2 个）<br>
        改线后受影响区域会自动重算，树与草不会落入路面或水面
      </div>
    </div>
    <aside>
      <div class="field">
        <label>随机种子 seed <b id="seedVal"></b></label>
        <input type="number" id="seed" min="1" step="1">
      </div>
      <div class="field">
        <label>植被密度 <b id="densityVal"></b></label>
        <input type="range" id="density" min="0" max="1" step="0.01">
      </div>
      <div class="field">
        <label>坡向偏好 <b id="aspectVal"></b></label>
        <select id="aspect">
          <option value="all">任意坡向</option>
          <option value="east">阳坡（东坡向）</option>
          <option value="south">南坡向</option>
          <option value="ridge">脊线（陡坡优先）</option>
        </select>
      </div>
      <div class="field">
        <label>风速 <b id="windVal"></b></label>
        <input type="range" id="wind" min="0" max="5" step="0.1">
      </div>
      <div class="field">
        <label>季节（只改材质与叶量）</label>
        <div class="season-row" id="seasonRow">
          <button data-season="spring">春</button>
          <button data-season="summer">夏</button>
          <button data-season="autumn">秋</button>
          <button data-season="winter">冬</button>
        </div>
      </div>
      <div class="field">
        <label>道路宽度 <b id="roadWidthVal"></b></label>
        <input type="range" id="roadWidth" min="12" max="64" step="1">
      </div>
      <div class="btn-grid">
        <button id="screenshot">截图 PNG</button>
        <button id="save">保存参数</button>
        <button id="restore">恢复参数</button>
        <button id="reset">重置场景</button>
        <label for="importFile">导入参数</label>
        <button id="exportBtn">导出参数</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <div class="stats" id="stats"></div>
    </aside>
  </main>
  <div class="toast" id="toast"></div>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
