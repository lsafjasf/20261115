<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>红蓝套准调准训练台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>双色胶印 · 红蓝套准调准训练台</h1>
    <div class="status-pill" id="statusPill">待印刷</div>
  </header>

  <main class="layout">
    <section class="canvas-card">
      <canvas id="pressCanvas" width="900" height="620"></canvas>
      <div class="canvas-hint">移动鼠标启用放大镜，靠近套准标记可读取红/蓝十字偏移量</div>
    </section>

    <aside class="panel">
      <h2>调节面板</h2>

      <div class="control-group">
        <label>横向位移修正 <span id="dxVal">0 μm</span></label>
        <input type="range" id="dxSlider" min="-300" max="300" step="5" value="0" />
      </div>
      <div class="control-group">
        <label>纵向位移修正 <span id="dyVal">0 μm</span></label>
        <input type="range" id="dySlider" min="-300" max="300" step="5" value="0" />
      </div>
      <div class="control-group">
        <label>红墨浓度 <span id="redVal">0.780</span></label>
        <input type="range" id="redSlider" min="0.5" max="1.5" step="0.01" value="0.78" />
      </div>
      <div class="control-group">
        <label>蓝墨浓度 <span id="blueVal">1.240</span></label>
        <input type="range" id="blueSlider" min="0.5" max="1.5" step="0.01" value="1.24" />
      </div>

      <div class="btn-row">
        <button id="reprintBtn" class="primary">应用修正并重印预览</button>
        <button id="reprintOnlyBtn">仅重印（验证稳定性）</button>
      </div>
      <div class="btn-row">
        <button id="undoBtn" disabled>撤销上一次修正并重印</button>
        <button id="resetBtn">重置</button>
      </div>
      <div class="btn-row">
        <button id="autoBtn" class="accent">自动调准演示</button>
        <button id="soundBtn" class="on">音效：开</button>
      </div>

      <div class="readout">
        <h3>测量读数（放大镜）</h3>
        <div class="metric"><span>横向偏差 X</span><b id="mX">—</b></div>
        <div class="metric"><span>纵向偏差 Y</span><b id="mY">—</b></div>
        <div class="metric"><span>红墨浓度</span><b id="mRed">—</b></div>
        <div class="metric"><span>蓝墨浓度</span><b id="mBlue">—</b></div>
        <div class="metric"><span>重影指数</span><b id="mGhost">—</b></div>
        <div class="metric"><span>本张判定</span><b id="mVerdict">—</b></div>
      </div>

      <div class="progress-wrap">
        <div class="progress-label">
          <span>连续合格张数</span><b id="streakText">0 / 10</b>
        </div>
        <div class="progress"><div id="streakBar"></div></div>
      </div>

      <div class="log-wrap">
        <h3>运行日志</h3>
        <ul id="eventLog"></ul>
      </div>
    </aside>
  </main>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
