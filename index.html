<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>风车旱地水车调水模拟</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #eef3f6;
      color: #27333a;
    }
    header {
      padding: 14px 22px;
      background: #2f5d6e;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    header h1 { font-size: 18px; margin: 0; }
    #banner { font-size: 14px; padding: 4px 12px; border-radius: 12px; background: rgba(255,255,255,.18); }
    #banner.ok { background: #2e7d4f; }
    #banner.fail { background: #d8452f; }
    main {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 16px;
      padding: 16px 22px;
      max-width: 1280px;
      margin: 0 auto;
    }
    #scene {
      width: 100%;
      height: 560px;
      background: #cfe6f2;
      border-radius: 10px;
      border: 1px solid #b8c6ce;
    }
    .panel {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      border: 1px solid #d6dee3;
    }
    .panel h2 { font-size: 15px; margin: 0 0 12px; }
    label { display: block; font-size: 13px; margin: 12px 0 4px; }
    input[type="range"] { width: 100%; }
    button {
      width: 100%;
      margin-top: 8px;
      padding: 9px;
      border: none;
      border-radius: 7px;
      background: #3d7a8f;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #2f5d6e; }
    button.danger { background: #d8452f; }
    button.warn { background: #c27a2e; }
    #readout {
      margin-top: 10px;
      padding: 10px;
      font-size: 12.5px;
      background: #f4f7f9;
      border-radius: 7px;
      line-height: 1.7;
    }
    .hint { font-size: 12px; color: #6a7880; line-height: 1.6; }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>风车旱地水车调水模拟</h1>
    <span id="banner">风车旱地水车调水模拟</span>
  </header>
  <main>
    <canvas id="scene"></canvas>
    <div class="panel">
      <h2>控制台</h2>
      <label>风叶迎角 <span id="pitchVal"></span></label>
      <input id="pitch" type="range" min="0" max="45" value="20" />
      <label>低田闸门（高程 2m）</label>
      <input id="gate0" type="range" min="0" max="100" value="0" />
      <label>中田闸门（高程 5m）</label>
      <input id="gate1" type="range" min="0" max="100" value="0" />
      <label>高田闸门（高程 8m）</label>
      <input id="gate2" type="range" min="0" max="100" value="0" />
      <button id="auto">自动调水演示</button>
      <button id="pause">暂停</button>
      <button id="slowClose" class="warn">缓闭全部闸门</button>
      <button id="snapClose" class="danger">急关闸门（验证水锤）</button>
      <button id="sound">开启声音</button>
      <button id="reset">重置</button>
      <div id="readout"></div>
      <p class="hint">
        目标：120 秒内三块田湿度均达到 70%，总耗水不超过 260L。
        风大时泵压升高；急关闸门会产生水锤报警，缓闭则不会。
      </p>
    </div>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
