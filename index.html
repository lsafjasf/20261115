<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>厂区供水管网设计器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">厂区供水管网设计器</div>
    <div class="toolbar-group">
      <button id="btn-undo" type="button">撤销 (Ctrl+Z)</button>
      <button id="btn-redo" type="button">重做 (Ctrl+Y)</button>
    </div>
    <div class="toolbar-group">
      <button id="btn-save" type="button">保存 JSON</button>
      <button id="btn-load" type="button">导入 JSON</button>
      <button id="btn-reset" type="button">恢复示例</button>
      <input id="file-input" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main class="layout">
    <section class="canvas-wrap">
      <canvas id="canvas" width="1000" height="560"></canvas>
      <div id="hint" class="hint">
        拖拽节点或管段调整布线；点击管段设置阀门方向与管径；点击空白取消选择
      </div>
    </section>

    <aside class="sidebar">
      <section class="panel">
        <h2>选中对象</h2>
        <div id="inspector">
          <p class="muted">未选择任何对象</p>
        </div>
      </section>

      <section class="panel">
        <h2>实时计算结果</h2>
        <div id="summary"></div>
        <table class="result-table">
          <thead>
            <tr><th>管段</th><th>流量 L/s</th><th>流速 m/s</th><th>损失 m</th></tr>
          </thead>
          <tbody id="edge-rows"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>自动检查</h2>
        <ul id="issues" class="issues"></ul>
      </section>
    </aside>
  </main>

  <script src="js/engine.js"></script>
  <script src="js/history.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
