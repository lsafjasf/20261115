<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>低多边形城区 · 任意轴剖切</title>
    <link rel="stylesheet" href="src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>

      <header id="topbar">
        <div class="brand">低多边形城区剖切</div>
        <label>城市 seed
          <select id="seedSelect"></select>
        </label>
        <button id="regenBtn">重新生成</button>
        <span class="spacer"></span>
        <button id="saveBtn">保存</button>
        <button id="loadBtn">载入</button>
        <button id="exportBtn">导出</button>
        <button id="importBtn">导入</button>
        <input id="importFile" type="file" accept="application/json" hidden />
        <button id="shotBtn">截图</button>
        <button id="testBtn">自检</button>
      </header>

      <aside id="clipPanel">
        <h2>剖切面</h2>
        <div id="axisControls"></div>
        <p class="hint">勾选启用后，拖动场景中的彩色球或滑块。球颜色：X 红 / Y 绿 / Z 蓝。</p>
      </aside>

      <aside id="editPanel" class="hidden">
        <h2>建筑 <span id="editId"></span></h2>
        <label>楼层数 <input id="editFloors" type="number" min="1" max="20" step="1" /></label>
        <label>层高 <input id="editFloorHeight" type="number" min="2.5" max="6" step="0.1" /></label>
        <label>用途
          <select id="editUsage"></select>
        </label>
        <div class="outline">
          <div>总高度 <b id="editHeight"></b></div>
          <div>占地 <b id="editFootprint"></b></div>
        </div>
        <button id="closeEdit">完成</button>
      </aside>

      <div id="status"></div>
      <div id="testResults" class="hidden"></div>
    </div>
    <script type="module" src="src/main.mjs"></script>
  </body>
</html>
