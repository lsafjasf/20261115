<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>三语混排排版器</title>
    <link rel="stylesheet" href="web/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>三语混排排版器</h1>
        <p class="hint">中文 / English / 123 混排 · Canvas 测量与预览 · SVG 保留文本</p>

        <div class="control-grid">
          <label>语言模式
            <select id="modeSelect"></select>
          </label>
          <label>字号 <span id="sizeLabel"></span>
            <input id="sizeInput" type="range" min="11" max="24" step="1" />
          </label>
          <label>行距 <span id="lineHeightLabel"></span>
            <input id="lineHeightInput" type="range" min="1.3" max="2.2" step="0.05" />
          </label>
          <label>断行规则
            <select id="breakSelect">
              <option value="greedy">greedy 常规</option>
              <option value="strict">strict 避头尾</option>
            </select>
          </label>
        </div>

        <div class="button-row">
          <button id="detectBtn" type="button">检测问题</button>
          <button id="repairBtn" type="button" class="primary">自动修复</button>
          <button id="exportBtn" type="button">导出 SVG</button>
        </div>

        <h2>段落锁定</h2>
        <div id="lockList" class="lock-list"></div>

        <h2>检测结果</h2>
        <ul id="issueList" class="issue-list"></ul>
        <h2>修复日志</h2>
        <ol id="logList" class="log-list"></ol>
      </section>

      <section class="stage">
        <canvas id="preview" width="560" height="760"></canvas>
        <p class="hint">虚线框为局部锁定段落；重新流排只移动未锁定段落。</p>
      </section>
    </main>
    <script type="module" src="web/app.js"></script>
  </body>
</html>
