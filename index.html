<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>海上风电储能调度模拟</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b1622; color: #d7e3ee; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #sea { flex: 1; display: block; }
  #panel { width: 340px; background: #101f30; padding: 12px; overflow-y: auto; border-left: 2px solid #1e3a52; }
  h1 { font-size: 16px; color: #6fc3ff; margin-bottom: 8px; }
  h2 { font-size: 13px; color: #8fb8d8; margin: 10px 0 4px; }
  .row { display: flex; justify-content: space-between; font-size: 12px; margin: 2px 0; }
  .val { color: #ffd76f; font-family: monospace; }
  .turbine-box { background: #16283c; border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
  .turbine-box label { font-size: 11px; color: #9db8cc; display: flex; justify-content: space-between; }
  input[type=range] { width: 100%; accent-color: #4da3ff; }
  .bar { height: 14px; background: #1a2c40; border-radius: 4px; overflow: hidden; position: relative; margin: 3px 0; }
  .bar > div { height: 100%; transition: width .2s; }
  .bar .lim { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff5f5f; }
  .btn { background: #1d3a56; color: #cfe4f5; border: 1px solid #2f5c85; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; margin: 2px; }
  .btn.active { background: #2f6ea8; border-color: #6fc3ff; }
  .btn:hover { background: #27517a; }
  #log { font-size: 11px; height: 110px; overflow-y: auto; background: #0d1a29; border-radius: 4px; padding: 4px 6px; margin-top: 6px; }
  #log .gust { color: #ffb04d; } #log .lull { color: #7dd0ff; } #log .damage { color: #ff6f6f; }
  #log .ok { color: #7dff9a; } #log .fail { color: #ff5f5f; font-weight: bold; }
  #peaks { display: flex; gap: 6px; margin: 4px 0; }
  .peak { flex: 1; text-align: center; font-size: 11px; padding: 3px 0; border-radius: 4px; background: #1a2c40; color: #7d93a8; }
  .peak.now { background: #6b4d12; color: #ffd76f; }
  .peak.done { background: #1c4a2a; color: #7dff9a; }
  .peak.miss { background: #5a1d1d; color: #ff8f8f; }
  #chart { width: 100%; height: 90px; background: #0d1a29; border-radius: 4px; margin-top: 4px; }
  #banner { position: fixed; top: 40%; left: 35%; transform: translateX(-50%); font-size: 28px; padding: 18px 36px; border-radius: 10px; display: none; z-index: 9; }
  #banner.ok { display: block; background: rgba(20,80,40,.92); color: #9dffb0; }
  #banner.fail { display: block; background: rgba(90,20,20,.92); color: #ffb0b0; }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div id="panel">
  <h1>海上风电 → 岸上储能调度</h1>
  <div class="row"><span>剩余时间</span><span class="val" id="time">10:00</span></div>
  <div class="row"><span>风速 / 风向</span><span class="val" id="wind">-</span></div>
  <div class="row"><span>总发电 / 用电需求</span><span class="val" id="power">-</span></div>
  <div id="peaks"></div>
  <h2>储能站</h2>
  <div class="row"><span>SOC（低于 15% 失败）</span><span class="val" id="soc">-</span></div>
  <div class="bar"><div id="socbar" style="background:#3fbf6f"></div><div class="lim" style="left:15%"></div></div>
  <div class="row"><span>电池健康度</span><span class="val" id="health">-</span></div>
  <div class="bar"><div id="healthbar" style="background:#bf8f3f"></div></div>
  <div class="row"><span>充放功率（红线 8MW 安全上限）</span><span class="val" id="batkw">-</span></div>
  <div class="bar"><div id="batbar" style="background:#4da3ff"></div><div class="lim" style="left:53.3%"></div></div>
  <div>
    <button class="btn batmode active" data-m="auto">自动</button>
    <button class="btn batmode" data-m="charge">充电</button>
    <button class="btn batmode" data-m="discharge">放电</button>
    <button class="btn batmode" data-m="idle">闲置</button>
  </div>
  <h2>风机控制</h2>
  <div id="turbines"></div>
  <h2>功率曲线（绿=发电 红=需求）</h2>
  <canvas id="chart" width="316" height="90"></canvas>
  <h2>事件</h2>
  <div id="log"></div>
  <h2>模拟速度</h2>
  <div>
    <button class="btn spd" data-s="0">暂停</button>
    <button class="btn spd active" data-s="1">1x</button>
    <button class="btn spd" data-s="4">4x</button>
    <button class="btn spd" data-s="10">10x</button>
    <button class="btn" id="restart">重开</button>
    <button class="btn" id="mute">声音开</button>
  </div>
</div>
<div id="banner"></div>
<script src="sim.js"></script>
<script src="game.js"></script>
</body>
</html>
