<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风铃舞台 · Wind Chime Stage</title>
<style>
  :root {
    --bg: #0d1420;
    --panel: #16202f;
    --accent: #6ec6ff;
    --text: #d7e3f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "PingFang SC", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 4px 0 12px; letter-spacing: 2px; }
  #stage {
    background: linear-gradient(#101b2c, #0a1220);
    border: 1px solid #24344c; border-radius: 10px;
    cursor: crosshair; touch-action: none;
    max-width: 100%;
  }
  #toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-top: 12px; padding: 10px 14px;
    background: var(--panel); border-radius: 10px; border: 1px solid #24344c;
  }
  button {
    background: #22344e; color: var(--text); border: 1px solid #35507a;
    border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #2c4365; }
  button.active { background: var(--accent); color: #08243c; border-color: var(--accent); }
  .slider-group { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .slider-group input[type=range] { width: 110px; }
  #status { font-size: 12px; color: #8fb3d9; margin-top: 8px; min-height: 16px; }
  #timeline {
    width: 900px; max-width: 100%; height: 6px; background: #1a2740;
    border-radius: 3px; margin-top: 10px; overflow: hidden;
  }
  #timeline-fill { height: 100%; width: 0; background: var(--accent); }
</style>
</head>
<body>
  <h1>风铃舞台 · 12 秒循环</h1>
  <canvas id="stage" width="900" height="480"></canvas>
  <div id="timeline"><div id="timeline-fill"></div></div>
  <div id="toolbar">
    <button id="btn-play">▶ 播放</button>
    <button id="btn-loop" class="active">🔁 循环</button>
    <button id="btn-add">＋ 放置风源</button>
    <button id="btn-del">✕ 删除风源</button>
    <button id="btn-save">💾 保存</button>
    <button id="btn-load">📂 读取</button>
    <button id="btn-export">⬇ 导出JSON</button>
    <div class="slider-group">方向 <input id="sl-angle" type="range" min="-180" max="180" value="0"><span id="v-angle"></span></div>
    <div class="slider-group">强度 <input id="sl-strength" type="range" min="10" max="100" value="70"><span id="v-strength"></span></div>
    <div class="slider-group">衰减 <input id="sl-decay" type="range" min="40" max="500" value="180"><span id="v-decay"></span></div>
  </div>
  <div id="status">点击「＋ 放置风源」后在画布上点击放置；拖动风源可移动，滑杆调整选中风源。</div>
  <script src="sim.js"></script>
  <script src="audio.js"></script>
  <script src="main.js"></script>
</body>
</html>
