<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潮汐发电模拟 · Tidal Barrage</title>
<style>
  :root {
    --bg: #071a26;
    --panel: #0e2b3d;
    --panel2: #123a52;
    --line: #1f5170;
    --text: #d8ecf7;
    --muted: #7fa6bd;
    --accent: #37c0d6;
    --good: #4cd07f;
    --warn: #f0b443;
    --bad: #ef6a5e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 700px at 60% -10%, #10384f, var(--bg));
    color: var(--text);
    font: 14px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px;
    padding: 14px 20px 6px;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  header .sub { color: var(--muted); font-size: 13px; }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 14px;
    padding: 10px 20px 20px;
  }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
  .card {
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
  }
  canvas { width: 100%; display: block; border-radius: 8px; background: #06202f; }
  .hud {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 12px;
  }
  .metric {
    background: rgba(255,255,255,.03);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .metric .k { color: var(--muted); font-size: 12px; }
  .metric .v { font-size: 18px; font-weight: 600; }
  .metric .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .bar {
    height: 8px; border-radius: 4px; background: #08222f;
    overflow: hidden; margin-top: 6px; position: relative;
  }
  .bar .fill { height: 100%; background: var(--accent); transition: width .2s linear; }
  .bar .band {
    position: absolute; top: 0; bottom: 0;
    background: rgba(76,208,127,.22);
    border-left: 1px solid var(--good); border-right: 1px solid var(--good);
  }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--accent); }
  .controls { display: grid; gap: 12px; }
  .ctrl-group {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    background: rgba(255,255,255,.02);
  }
  .ctrl-group .title {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; margin-bottom: 8px;
  }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    flex: 1;
    background: #143d56;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 8px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.active {
    background: var(--accent);
    color: #04222c;
    font-weight: 700;
    border-color: var(--accent);
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .gate-track {
    height: 10px; border-radius: 5px; background: #08222f;
    overflow: hidden; margin-top: 6px;
  }
  .gate-track .fill { background: var(--warn); height: 100%; }
  .topbtns { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .topbtns button { flex: 0 0 auto; padding: 8px 14px; }
  .ship {
    display: flex; justify-content: space-between;
    padding: 6px 8px; border-radius: 8px; margin-bottom: 6px;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--line);
    font-size: 13px;
  }
  .ship .state.waiting { color: var(--warn); }
  .ship .state.transiting { color: var(--accent); }
  .ship .state.done { color: var(--good); }
  .log {
    max-height: 130px; overflow-y: auto;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px; color: var(--muted);
  }
  .log div { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
  .modal-back {
    position: fixed; inset: 0; background: rgba(3,15,22,.78);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  .modal-back.show { display: flex; }
  .modal {
    width: min(760px, 92vw);
    max-height: 88vh; overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 14px;
    padding: 22px;
  }
  table { width: 100%; border-collapse: collapse; margin: 10px 0; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; }
  .verdict { font-weight: 700; }
  .verdict.pass { color: var(--good); }
  .verdict.fail { color: var(--bad); }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .mode-pill {
    font-size: 12px; padding: 2px 8px; border-radius: 10px;
    background: #143d56; border: 1px solid var(--line); color: var(--accent);
  }
</style>
</head>
<body>
<header>
  <h1>潮汐发电模拟</h1>
  <span class="sub">两座潮闸 · 两组涡轮 · 12 分钟 · 三次通航 · 储能须保持目标区间</span>
</header>

<div class="layout">
  <section class="card">
    <div class="topbtns">
      <button id="btnStart">开始 / 暂停</button>
      <button id="btnReset">重置</button>
      <button id="btnAutoCons">自动驾驶：保守</button>
      <button id="btnAutoAgg">自动驾驶：激进</button>
      <button id="btnManual">手动控制</button>
      <button id="btnSpeed">速度 ×1</button>
      <button id="btnMute">🔊 音效开</button>
    </div>
    <canvas id="scene" width="960" height="460"></canvas>
    <div class="hud">
      <div class="metric">
        <div class="k">剩余时间</div>
        <div class="v" id="hudTime">12:00</div>
      </div>
      <div class="metric">
        <div class="k">实时功率</div>
        <div class="v"><span id="hudPower">0.0</span> <small>kW</small></div>
      </div>
      <div class="metric">
        <div class="k">储能（目标 55%–85%）</div>
        <div class="v"><span id="hudStorage">50.0</span><small>%</small></div>
        <div class="bar"><div class="band" id="band"></div><div class="fill" id="storageFill"></div></div>
      </div>
      <div class="metric">
        <div class="k">水头（海-港）</div>
        <div class="v"><span id="hudHead">0.00</span> <small>m</small></div>
      </div>
    </div>
  </section>

  <aside class="card controls">
    <div>
      <h2>控制模式 <span class="mode-pill" id="modePill">手动</span></h2>
    </div>
    <div class="ctrl-group" id="ctrl0"></div>
    <div class="ctrl-group" id="ctrl1"></div>
    <div class="ctrl-group">
      <h2>通航队列</h2>
      <div id="ships"></div>
    </div>
    <div class="ctrl-group">
      <h2>事件日志</h2>
      <div class="log" id="log"></div>
    </div>
  </aside>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h2 style="font-size:18px">本局结果与策略对比</h2>
    <div id="modalBody"></div>
    <div class="topbtns" style="margin-top:14px">
      <button id="btnReplay">再来一局</button>
    </div>
  </div>
</div>

<script src="sim.js"></script>
<script src="strategies.js"></script>
<script src="app.js"></script>
</body>
</html>
