<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风景图三段延展</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1c2330; color: #e8edf5;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    background: #2f3b52; color: #e8edf5; border: 1px solid #46546f;
    border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #3a4a68; }
  button.primary { background: #3d6fd1; border-color: #3d6fd1; }
  button.primary:hover { background: #4a7de0; }
  .stage {
    position: relative; max-width: 96vw; overflow-x: auto;
    border: 1px solid #39445c; border-radius: 8px; background: #141a26;
    padding: 12px;
  }
  canvas { display: block; image-rendering: auto; border-radius: 4px; }
  .handle {
    position: absolute; top: 12px; bottom: 12px; width: 14px;
    margin-left: -7px; cursor: ew-resize; z-index: 5;
    display: flex; align-items: center; justify-content: center;
  }
  .handle::after {
    content: ""; width: 4px; height: 46px; border-radius: 2px;
    background: #ffd34d; box-shadow: 0 0 6px rgba(0,0,0,.6);
  }
  .handle:hover::after { background: #ffe38a; }
  .info { font-size: 12px; color: #9fb0c8; }
  .labels { display: flex; gap: 18px; font-size: 12px; color: #c6d2e4; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
  <h1>程序化风景图 · 三段拖拽延展</h1>
  <div class="labels">
    <span><span class="swatch" style="background:#ff785a"></span>左区</span>
    <span><span class="swatch" style="background:#5ac88c"></span>中区</span>
    <span><span class="swatch" style="background:#6e96ff"></span>右区</span>
    <span class="info">拖动两条黄色手柄改变各区域宽度，边界自动做颜色混合与纹理延续</span>
  </div>
  <div class="toolbar">
    <button id="btnReset">原始尺寸</button>
    <button id="btnMild">轻微拉伸 (×1.33)</button>
    <button id="btnStrong">强烈拉伸 (×3)</button>
    <button id="btnRegen">换一张风景</button>
    <button id="btnExport" class="primary">导出 PNG</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="handle" id="handle0"></div>
    <div class="handle" id="handle1"></div>
  </div>
  <div class="info" id="info"></div>
  <script src="js/landscape.js"></script>
  <script src="js/stretch.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
